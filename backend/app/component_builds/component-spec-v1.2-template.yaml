# ── 8. 生成结果验证 ────────────────────────────────────────
validation:  # 生成结果验证规则
  parameter_validation:  # 生成前参数校验
    required_parameters_complete: true  # [选填]（AI补全，人工Review） 检查必填参数均非空
    enum_validation: true  # [选填]（AI补全，人工Review） 检查枚举参数合法
    constraint_validation: true  # [选填]（AI补全，人工Review） 执行参数约束

  topology:  # B-Rep 拓扑要求
    expected_body_count: 1  # [选填]（自动生成） 期望实体数量
    solid_required: true  # [选填]（AI补全，人工Review） 是否必须为实体
    closed_shell_required: true  # [选填]（AI补全，人工Review） 是否必须为闭合壳
    manifold_required: true  # [选填]（AI补全，人工Review） 是否要求流形拓扑
    self_intersection_allowed: false  # [选填]（AI补全，人工Review） 是否允许自相交

  geometry:  # 参数化几何生成或验证配置
    dimensional_tolerance: 0.01  # [选填]（AI补全，人工Review） 尺寸容差，单位 mm
    angular_tolerance: 0.1  # [选填]（AI补全，人工Review） 角度容差，单位 deg
    expected_through_hole_count_expression: "bolt_hole_count + 1"  # [选填]（自动生成） 期望贯穿孔数量
    positive_volume_required: true  # [选填]（AI补全，人工Review） 是否要求体积为正
