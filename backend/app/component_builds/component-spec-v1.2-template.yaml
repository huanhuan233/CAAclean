# ============================================================
# ComponentSpec v1.2 — 参数化图元建库交付模板
#
# 每个图元建议至少交付：
#   1. 本 YAML：身份、坐标、参数、约束、接口、生成配方、预设规格等
#   2. reference STEP：默认参数/默认预设对应的几何基准
# 可选交付：参数化生成脚本、GLB 预览、PNG 缩略图
#
# 全库约定：
#   - 长度单位：mm
#   - 角度单位：deg
#   - 坐标系：右手系
#   - 参数 key：英文小写下划线；通用参数不得自造同义词（如 flange_outer_diameter、bolt_hole_count）
#   - 图元 ID：英文小写加连字符，全库唯一（如 flange-weld-neck-gbt9124）
#   - 所有表达式必须由受限表达式引擎执行，禁止直接 eval
#
# 注释标签说明（前期建库 MVP）：
#   【必填】：建库交付包必须提供；本模板仅保留最小人工输入
#   [选填]：允许留空，由 AI、标准库、已有库或流水线补齐后再人工 Review
#   （人工）：必须由建库人员明确提供
#   （人工Review）：允许系统预填，但建议发布前人工复核
#   （AI补全，人工Review）：默认由 AI 推断或生成，人工只做 Review
#   （可关联标准库/已有库，也可AI补全）：优先检索可靠数据，缺失时允许 AI 推断
#   （自动生成）：由建库平台、CAD 解析器或交付流水线计算回填
#   （系统固定）：由 ComponentSpec 或全库约定给定，不由建库人员填写
#   （人工提供/已有库导入）：可上传文件，也可直接引用已有资产
#   （已有库解析/自动生成）：从已有文件元数据解析或由流水线生成
#
# 重要：parameters[].required=true 表示 CAD 生成前该参数必须有最终值，
#       不表示建库人员必须手填；允许 AI/数据库补齐后进入人工 Review。
# ============================================================

schema_version: "1.2"  # 【必填】（系统固定） 规范版本；结构不兼容变更时升级主版本
spec_type: "component"  # 【必填】（系统固定） 规范对象类型；图元固定为 component

# ── 1. 身份与版本 ──────────────────────────────────────────
identity: # 图元身份与版本信息
  id: "flange-weld-neck-gbt9124"  # 【必填】（人工） 所属作用域内的唯一标识
  name: "带颈对焊钢制管法兰"  # 【必填】（人工） 当前对象的名称
  name_en: "Weld Neck Steel Pipe Flange"  # [选填]（AI补全，人工Review） 图元英文名称
  type: "flange"  # 【必填】（人工） 类型枚举；用于解析、检索和校验
  subtype: "weld_neck"  # [选填]（AI补全，人工Review） 细分类别；用于区分不同结构
  family: "pipe_connection"  # [选填]（AI补全，人工Review） 所属功能族
  standard: #执行或接口标准
    number: "GB/T 9124.1-2019"  # [选填]（可关联标准库/已有库，也可AI补全） 标准编号
    edition: "2019"  # [选填]（可关联标准库/已有库，也可AI补全） 标准版本年份
    title: "钢制管法兰 第1部分：PN系列"  # [选填]（可关联标准库/已有库，也可AI补全） 标准正式名称
  description: "用于管道对焊连接的带颈法兰；本图元通过参数和预设生成不同 DN、PN 规格。"  # [选填]（AI补全，人工Review） 用途及结构说明
  license: "自制"  # [选填]（人工Review） 数据与模型授权方式
  version: "1.2.0"  # [选填]（自动生成） 语义化版本号；缺省可自动设为 1.0.0
  author: "张三"  # [选填]（人工Review） 首次创建人
  maintainer: "张三"  # [选填]（人工Review） 当前维护人
  created_at: "2026-07-20"  # [选填]（自动生成） 首次创建日期，格式 YYYY-MM-DD
  updated_at: "2026-07-20"  # [选填]（自动生成） 最近更新日期，格式 YYYY-MM-DD
  status: "draft" # [选填]（AI补全，人工Review） draft / reviewed / released / deprecated
  tags: ["法兰", "带颈对焊法兰", "钢制管法兰", "GB/T 9124.1"]  # [选填]（AI补全，人工Review） 检索标签
  default_preset: "DN100-PN16"  # [选填]（AI补全，人工Review） 未指定规格时采用的预设
  default_color: "#8B8682"  # [选填]（AI补全，人工Review） 3D 预览颜色，十六进制 RGB

# ── 2. 坐标系与建模基准 ────────────────────────────────────
# 全库建议：连接端面中心作为端口原点，端口 axis 指向零件外部。
coordinate_system:  # 图元局部坐标系
  length_unit: "mm"  # [选填]（系统固定） 长度单位
  angle_unit: "deg"  # [选填]（系统固定） 角度单位
  handedness: "right_handed"  # [选填]（系统固定） 坐标系手性
  origin: [0.0, 0.0, 0.0]  # [选填]（AI补全，人工Review） 局部原点 [x, y, z]
  x_axis: [1.0, 0.0, 0.0]  # [选填]（AI补全，人工Review） 局部 X 轴单位向量
  y_axis: [0.0, 1.0, 0.0]  # [选填]（AI补全，人工Review） 局部 Y 轴单位向量
  z_axis: [0.0, 0.0, 1.0]  # [选填]（AI补全，人工Review） 局部 Z 轴单位向量
  origin_definition: "法兰密封端面中心"  # [选填]（AI补全，人工Review） 原点对应的几何位置
  z_axis_definition: "沿法兰轴线，由密封端面指向颈部焊接端"  # [选填]（AI补全，人工Review） Z 轴的物理方向
  zero_rotation_definition: "第一个螺栓孔中心位于 +X 方向"  # [选填]（AI补全，人工Review） 绕主轴的零旋转方向

