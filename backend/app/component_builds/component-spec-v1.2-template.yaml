# 只读派生参数，由表达式引擎计算，不由建库人员重复填写。
derived_parameters:  # 通过表达式计算的只读参数
  - name: "flange_outer_radius"  # [选填]（AI补全，人工Review） 当前对象的名称
    type: "float"  # [选填]（AI补全，人工Review） 类型枚举；用于解析、检索和校验
    unit: "mm"  # [选填]（AI补全，人工Review） 物理单位；无量纲项填 null
    expression: "flange_outer_diameter / 2"  # [选填]（AI补全，人工Review） 由受限引擎执行的表达式

  - name: "bolt_circle_radius"  # [选填]（AI补全，人工Review） 当前对象的名称
    type: "float"  # [选填]（AI补全，人工Review） 类型枚举；用于解析、检索和校验
    unit: "mm"  # [选填]（AI补全，人工Review） 物理单位；无量纲项填 null
    expression: "bolt_circle_diameter / 2"  # [选填]（AI补全，人工Review） 由受限引擎执行的表达式

  - name: "bore_radius"  # [选填]（AI补全，人工Review） 当前对象的名称
    type: "float"  # [选填]（AI补全，人工Review） 类型枚举；用于解析、检索和校验
    unit: "mm"  # [选填]（AI补全，人工Review） 物理单位；无量纲项填 null
    expression: "bore_diameter / 2"  # [选填]（AI补全，人工Review） 由受限引擎执行的表达式

# ── 4. 参数约束 ────────────────────────────────────────────
constraints:  # 【必填】 参数间约束
  expression_language: "CEL"  # [选填]（系统固定） 安全表达式语法
  rules:  # 约束或兼容规则列表
    - id: "diameter-order"  # [选填]（AI补全，人工Review） 所属作用域内的唯一标识
      expression: "flange_outer_diameter > bolt_circle_diameter"  # [选填]（AI补全，人工Review） 由受限引擎执行的表达式
      severity: "error"  # [选填]（AI补全，人工Review） 失败等级；error 阻断，warning 提示
      message: "法兰外径必须大于螺栓孔中心圆直径"  # [选填]（AI补全，人工Review） 校验失败提示

    - id: "bolt-clearance"  # [选填]（AI补全，人工Review） 所属作用域内的唯一标识
      expression: "bolt_circle_diameter > bore_diameter + bolt_hole_diameter"  # [选填]（AI补全，人工Review） 由受限引擎执行的表达式
      severity: "error"  # [选填]（AI补全，人工Review） 失败等级；error 阻断，warning 提示
      message: "螺栓孔中心圆与内孔之间的径向空间不足"  # [选填]（AI补全，人工Review） 校验失败提示

    - id: "bolt-count-even"  # [选填]（AI补全，人工Review） 所属作用域内的唯一标识
      expression: "bolt_hole_count >= 2 && bolt_hole_count % 2 == 0"  # [选填]（AI补全，人工Review） 由受限引擎执行的表达式
      severity: "error"  # [选填]（AI补全，人工Review） 失败等级；error 阻断，warning 提示
      message: "螺栓孔数量必须为不小于 2 的偶数"  # [选填]（AI补全，人工Review） 校验失败提示

    - id: "wall-thickness-valid"  # [选填]（AI补全，人工Review） 所属作用域内的唯一标识
      expression: "wall_thickness == null || pipe_outer_diameter == null || wall_thickness * 2 < pipe_outer_diameter"  # [选填]（AI补全，人工Review） 由受限引擎执行的表达式
      severity: "error"  # [选填]（AI补全，人工Review） 失败等级；error 阻断，warning 提示
      message: "壁厚必须小于配管外径的一半"  # [选填]（AI补全，人工Review） 校验失败提示

    - id: "hub-diameter-order"  # [选填]（AI补全，人工Review） 所属作用域内的唯一标识
      expression: "hub_large_end_diameter == null || hub_small_end_diameter == null || hub_large_end_diameter >= hub_small_end_diameter"  # [选填]（AI补全，人工Review） 由受限引擎执行的表达式
      severity: "error"  # [选填]（AI补全，人工Review） 失败等级；error 阻断，warning 提示
      message: "颈部大端直径不得小于小端直径"  # [选填]（AI补全，人工Review） 校验失败提示

    - id: "rf-required-fields"  # [选填]（AI补全，人工Review） 所属作用域内的唯一标识
      expression: "facing_type != 'RF' || (raised_face_diameter != null && raised_face_height != null)"  # [选填]（AI补全，人工Review） 由受限引擎执行的表达式
      severity: "error"  # [选填]（AI补全，人工Review） 失败等级；error 阻断，warning 提示
      message: "RF 突面法兰必须提供突面直径和突面高度"  # [选填]（AI补全，人工Review） 校验失败提示

# ── 5. 装配接口（端口）─────────────────────────────────────
# frame.axis 必须指向图元外部；frame.up 用于消除绕轴旋转歧义。
ports:  # 图元对外连接接口
  - id: "flange_face"  # [选填]（AI补全，人工Review） 所属作用域内的唯一标识
    name: "法兰连接端"  # [选填]（AI补全，人工Review） 当前对象的名称
    type: "flange_face"  # [选填]（AI补全，人工Review） 类型枚举；用于解析、检索和校验
    role: "mechanical_connection"  # [选填]（AI补全，人工Review） 对象在流程中的用途
    frame:  # 端口局部坐标框架
      origin: [0.0, 0.0, 0.0]  # [选填]（AI补全，人工Review） 局部原点 [x, y, z]
      axis: [0.0, 0.0, -1.0]  # [选填]（AI补全，人工Review） 端口外法向或连接轴
      up: [1.0, 0.0, 0.0]  # [选填]（AI补全，人工Review） 消除绕轴歧义的参考方向
    interface:  # 用于配对的接口属性
      standard: "${identity.standard.number}"  # [选填]（可关联标准库/已有库，也可AI补全） 执行或接口标准
      DN: "${DN}"  # [选填]（可关联标准库/已有库，也可AI补全） 配置字段；按图元实际情况填写
      PN: "${PN}"  # [选填]（可关联标准库/已有库，也可AI补全） 配置字段；按图元实际情况填写
      facing_type: "${facing_type}"  # [选填]（可关联标准库/已有库，也可AI补全） 配置字段；按图元实际情况填写
      bolt_circle_diameter: "${bolt_circle_diameter}"  # [选填]（可关联标准库/已有库，也可AI补全） 配置字段；按图元实际情况填写
      bolt_hole_count: "${bolt_hole_count}"  # [选填]（可关联标准库/已有库，也可AI补全） 配置字段；按图元实际情况填写
      bolt_hole_diameter: "${bolt_hole_diameter}"  # [选填]（可关联标准库/已有库，也可AI补全） 配置字段；按图元实际情况填写
    compatible_with:  # 兼容端口及匹配条件
      port_types: ["flange_face"]  # [选填]（AI补全，人工Review） 允许连接的端口类型
      rules:  # 约束或兼容规则列表
        - "self.DN == other.DN"  # [选填]（AI补全，人工Review） 列表项；逐项填写或校验
        - "self.PN == other.PN"  # [选填]（AI补全，人工Review） 列表项；逐项填写或校验
        - "self.bolt_circle_diameter == other.bolt_circle_diameter"  # [选填]（AI补全，人工Review） 列表项；逐项填写或校验
        - "self.bolt_hole_count == other.bolt_hole_count"  # [选填]（AI补全，人工Review） 列表项；逐项填写或校验
        - "self.bolt_hole_diameter == other.bolt_hole_diameter"  # [选填]（AI补全，人工Review） 列表项；逐项填写或校验
    allowed_mates: ["flange_mate", "coincident_concentric"]  # [选填]（AI补全，人工Review） 允许的装配约束类型

  - id: "weld_end"  # [选填]（AI补全，人工Review） 所属作用域内的唯一标识
    name: "管道对焊端"  # [选填]（AI补全，人工Review） 当前对象的名称
    type: "butt_weld"  # [选填]（AI补全，人工Review） 类型枚举；用于解析、检索和校验
    role: "pipe_connection"  # [选填]（AI补全，人工Review） 对象在流程中的用途
    frame:  # 端口局部坐标框架
      origin: [0.0, 0.0, "${overall_height}"]  # [选填]（AI补全，人工Review） 局部原点 [x, y, z]
      axis: [0.0, 0.0, 1.0]  # [选填]（AI补全，人工Review） 端口外法向或连接轴
      up: [1.0, 0.0, 0.0]  # [选填]（AI补全，人工Review） 消除绕轴歧义的参考方向
    interface:  # 用于配对的接口属性
      DN: "${DN}"  # [选填]（可关联标准库/已有库，也可AI补全） 配置字段；按图元实际情况填写
      pipe_outer_diameter: "${pipe_outer_diameter}"  # [选填]（可关联标准库/已有库，也可AI补全） 配置字段；按图元实际情况填写
      wall_thickness: "${wall_thickness}"  # [选填]（可关联标准库/已有库，也可AI补全） 配置字段；按图元实际情况填写
      bevel_angle: "${weld_bevel_angle}"  # [选填]（AI补全，人工Review） 配置字段；按图元实际情况填写
    compatible_with:  # 兼容端口及匹配条件
      port_types: ["butt_weld", "pipe_end"]  # [选填]（AI补全，人工Review） 允许连接的端口类型
      rules:  # 约束或兼容规则列表
        - "self.DN == other.DN"  # [选填]（AI补全，人工Review） 列表项；逐项填写或校验
        - "abs(self.pipe_outer_diameter - other.pipe_outer_diameter) <= 0.1"  # [选填]（AI补全，人工Review） 列表项；逐项填写或校验
        - "abs(self.wall_thickness - other.wall_thickness) <= 0.1"  # [选填]（AI补全，人工Review） 列表项；逐项填写或校验
    allowed_mates: ["butt_weld_mate", "coincident_concentric"]  # [选填]（AI补全，人工Review） 允许的装配约束类型

# ── 6. 参数化几何生成配方 ──────────────────────────────────
# 大模型负责选择图元、补参数和编排；CAD 内核负责确定性建模。
geometry:  # 参数化几何生成或验证配置
  representation: "parametric_recipe"  # [选填]（AI补全，人工Review） 几何表示方式
  modeling_kernel: "OpenCascade"  # [选填]（AI补全，人工Review） CAD 几何内核
  generator:  # 参数化生成器配置
    mode: "dsl_or_script"  # [选填]（AI补全，人工Review） 生成器调用方式
    preferred_engine: "CadQuery"  # [选填]（AI补全，人工Review） 首选建模引擎
    engine_version: "2.x"  # [选填]（AI补全，人工Review） 兼容的引擎版本
    script_file: "flange-weld-neck.py"  # [选填]（AI补全，人工Review） 参数化脚本文件名
    entrypoint: "build_component"  # [选填]（AI补全，人工Review） 建模脚本入口函数
    script_required_for_release: true  # [选填]（AI补全，人工Review） 发布时是否强制提供脚本

  construction:  # 顺序执行的建模操作
    - id: "revolve_main_body"  # [选填]（AI补全，人工Review） 所属作用域内的唯一标识
      operation: "revolve_profile"  # [选填]（AI补全，人工Review） CAD 操作类型
      profile_plane: "XZ"  # [选填]（AI补全，人工Review） 二维剖面所在平面
      axis: "Z"  # [选填]（AI补全，人工Review） 端口外法向或连接轴
      angle: 360.0  # [选填]（AI补全，人工Review） 操作角度
      profile_definition: "由内孔、法兰盘、锥形颈部、焊接端和密封面尺寸构成的闭合剖面"  # [选填]（AI补全，人工Review） 剖面构成说明

    - id: "cut_bolt_holes"  # [选填]（AI补全，人工Review） 所属作用域内的唯一标识
      operation: "polar_pattern_cut"  # [选填]（AI补全，人工Review） CAD 操作类型
      depends_on: ["revolve_main_body"]  # [选填]（AI补全，人工Review） 依赖的前序操作 ID
      hole_diameter: "${bolt_hole_diameter}"  # [选填]（AI补全，人工Review） 阵列切孔直径表达式
      pitch_circle_diameter: "${bolt_circle_diameter}"  # [选填]（AI补全，人工Review） 阵列中心圆直径表达式
      count: "${bolt_hole_count}"  # [选填]（AI补全，人工Review） 阵列实例数量表达式
      start_angle: "${bolt_hole_start_angle}"  # [选填]（AI补全，人工Review） 阵列起始角
      direction: [0.0, 0.0, 1.0]  # [选填]（AI补全，人工Review） 操作方向向量
      through_all: true  # [选填]（AI补全，人工Review） 是否贯穿整个实体

    - id: "apply_root_fillet"  # [选填]（AI补全，人工Review） 所属作用域内的唯一标识
      operation: "fillet"  # [选填]（AI补全，人工Review） CAD 操作类型
      depends_on: ["revolve_main_body"]  # [选填]（AI补全，人工Review） 依赖的前序操作 ID
      target: "hub_to_flange_transition"  # [选填]（AI补全，人工Review） 命名面、边或特征
      radius: "${root_fillet_radius}"  # [选填]（AI补全，人工Review） 圆角半径表达式

    - id: "apply_weld_bevel"  # [选填]（AI补全，人工Review） 所属作用域内的唯一标识
      operation: "chamfer"  # [选填]（AI补全，人工Review） CAD 操作类型
      depends_on: ["apply_root_fillet"]  # [选填]（AI补全，人工Review） 依赖的前序操作 ID
      target: "weld_end_outer_edge"  # [选填]（AI补全，人工Review） 命名面、边或特征
      angle: "${weld_bevel_angle}"  # [选填]（AI补全，人工Review） 操作角度
      enabled_when: "weld_bevel_angle != null"  # [选填]（AI补全，人工Review） 启用步骤的条件

  output:  # CAD 导出配置
    format: "STEP"  # [选填]（AI补全，人工Review） 文件格式
    application_protocol: "AP242"  # [选填]（系统固定） STEP 应用协议
    preserve_names: true  # [选填]（AI补全，人工Review） 是否保留名称
    preserve_colors: true  # [选填]（AI补全，人工Review） 是否保留颜色
    filename_template: "${component_id}-${preset_name}.step"  # [选填]（自动生成） 输出文件命名模板

