# 一、具体可检索零件实例
resolved_variant: # @：无法获得；这是具体零件实例记录结构，需由零件库定义
  family_id: null # @：无法获得；系统内部零件族ID由零件库分配
  variant_id: null # @：无法获得；具体规格的唯一ID由零件库分配
  component_code: null # @：可以从图纸直接获得；通常位于产品信息区、型号栏或选型表
  material: null # @：可以从图纸直接获得；通常位于产品信息区或材料栏
  series: null # @：可以从图纸直接获得；例如A系列、B系列可从适用系列栏读取
  revision: null # @：无法获得；零件库修订版本需由PDM或发布流程维护
  lifecycle_status: null # @：无法获得；draft、released、deprecated属于发布管理状态

  configuration_key: # @：无法获得；检索键结构由零件库统一定义
    standard_number: null # @：可以从图纸直接获得；从参考标准或技术要求读取
    DN: null # @：可以从图纸直接获得；公称尺寸不能由实体直径可靠反推
    PN: null # @：可以从图纸直接获得；压力等级不能由STEP几何反推
    facing_type: null # @：可以从图纸直接获得；从密封面形式栏读取
    material: null # @：可以从图纸直接获得；从材料栏读取
    series: null # @：可以从图纸直接获得；从适用系列栏读取


# 二、实际模型资源
resolved_artifact: # @：无法获得；资源管理结构由零件库定义
  artifact_id: null # @：无法获得；文件资源ID由存储系统分配
  storage_uri: null # @：无法获得；文件存储位置由系统写入
  format: "STEP" # @：可以从STEP直接获得；可由文件头和格式识别
  source_application_protocol: null # @：可以从STEP直接获得；从FILE_SCHEMA等STEP头信息读取
  length_unit: null # @：可以从STEP直接获得；从STEP单位定义读取
  product_name: null # @：可以从STEP直接获得；文件包含产品名称时可直接读取
  sha256: null # @：可以获得但是需要推理和算法；需对实际文件计算哈希
  parser_version: null # @：无法获得；由解析流水线记录
  parse_result_uri: null # @：无法获得；由解析结果存储系统生成
  geometry_validation_status: null # @：可以获得但是需要推理和算法；需执行拓扑和尺寸核验后判定


# 三、原始STEP到规范坐标的转换
coordinate_resolution: # @：可以获得但是需要推理和算法；需进行主轴、端面和零角度识别
  source_origin: null # @：可以从STEP直接获得；可读取原始模型坐标，但它不一定是语义原点
  detected_main_axis: null # @：可以获得但是需要推理和算法；需分析圆柱面、旋转面及整体对称性
  detected_up_axis: null # @：可以获得但是需要推理和算法；需用首孔或其他非旋转对称特征消除转角歧义
  canonical_origin: null # @：可以获得但是需要推理和算法；需识别密封端面中心等语义基准
  canonical_main_axis: [0, 0, 1] # @：无法获得；属于全库统一坐标规范
  canonical_up_axis: [1, 0, 0] # @：无法获得；属于全库统一零角度规范
  source_to_canonical_matrix: null # @：可以获得但是需要推理和算法；由源坐标框和规范坐标框计算
  confidence: null # @：可以获得但是需要推理和算法；由轴线、端面和孔阵列识别质量计算
  needs_review: null # @：可以获得但是需要推理和算法；根据置信度和几何歧义自动判定


# 四、在现有ports[]中补充几何锚点
anchor: # @：可以获得但是需要推理和算法；需将端口语义绑定到实际STEP几何
  semantic_role: null # @：可以获得但是需要推理和算法；例如sealing_face、weld_end需进行零件族语义识别
  geometry_type: null # @：可以从STEP直接获得；可读取平面、圆柱面、圆锥面等B-Rep类型
  source_entity_refs: [] # @：可以获得但是需要推理和算法；需先选出正确接口面再记录实体引用
  selection_rule: null # @：无法获得；稳定的几何选择规则必须由零件族模板定义
  fallback_rule: null # @：无法获得；拓扑变化后的回退策略必须由系统定义


# 五、在现有ports[]中补充可执行装配行为
mate_behavior: # @：无法获得；装配求解合同不能从STEP或图纸自动读取
  origin_relation: "coincident" # @：无法获得；端口原点关系由装配规则定义
  axis_relation: "anti_parallel" # @：无法获得；两端口轴同向或反向由装配规则定义
  axial_offset: 0.0 # @：无法获得；垫片间隙、插入深度等偏移需人工或规则库定义
  allow_flip: false # @：无法获得；是否允许翻转属于装配业务规则
  rotation_mode: "indexed" # @：无法获得；自由旋转、锁定或分度旋转由装配规则定义
  symmetry_count: null # @：可以获得但是需要推理和算法；可由圆周孔阵列数量或旋转对称性计算
  clocking_reference: "first_bolt_hole" # @：无法获得；选择哪个特征作为零角度基准属于全库规范
  lock_translation: true # @：无法获得；自由度约束由装配求解合同定义
  lock_rotation: true # @：无法获得；是否锁定绕轴旋转由装配求解合同定义


# 六、字段级证据
field_evidence: # @：无法获得；证据记录结构由解析流水线定义
  fact_key: null # @：无法获得；规范字段名由系统映射规则定义
  source_kind: null # @：无法获得；drawing、step、standard等来源类型由流水线记录
  raw_value: null # @：可以从图纸直接获得；图纸事实应保留OCR或表格原始值
  normalized_value: null # @：可以获得但是需要推理和算法；需进行数值、枚举和单位归一化
  operator: null # @：可以从图纸直接获得；等于、大于等于、约等于可从尺寸符号读取
  source_region_id: null # @：可以从图纸直接获得；可记录事实所在图纸区域
  source_entity_refs: [] # @：可以获得但是需要推理和算法；需将测量结果关联到对应STEP面或特征
  confidence: null # @：可以获得但是需要推理和算法；由识别、匹配和多源一致性计算
  verification_status: null # @：可以获得但是需要推理和算法；通过图纸与STEP交叉核验产生
  needs_review: null # @：可以获得但是需要推理和算法；由置信度、冲突和缺失规则判定


# 七、执行就绪状态
readiness: # @：可以获得但是需要推理和算法；由完整性和验证规则综合计算
  retrieval_ready: false # @：可以获得但是需要推理和算法；检查实例ID、检索键和模型资源是否完整
  generation_ready: false # @：可以获得但是需要推理和算法；检查生成器和必需参数是否完整
  assembly_ready: false # @：可以获得但是需要推理和算法；检查坐标转换、端口锚点和配合行为是否完整
  blocking_reasons: [] # @：可以获得但是需要推理和算法；由完整性检查自动生成


# 八、生成器还需要补充的执行合同
generation_contract: # @：无法获得；生成器合同必须由建模程序作者定义
  generator_id: null # @：无法获得；生成器唯一ID由系统分配
  exact_generator_version: null # @：无法获得；精确兼容版本由生成器发布流程管理
  parameter_schema_version: null # @：无法获得；输入参数契约版本由系统定义
  generation_strategy: null # @：无法获得；reuse_existing或generate_new属于调用策略
  feature_naming_policy: null # @：无法获得；稳定特征命名必须由生成器实现
  generator_sha256: null # @：可以获得但是需要推理和算法；可对真实生成脚本计算哈希